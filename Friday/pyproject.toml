[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "friday-cli"
version = "0.1.0"
description = "Autonomous AI Coding & Workflow Automation CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "litellm>=1.40.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
friday = "friday.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["friday"]
